title: Site

tabs:
  content:
    columns:
      - width: 1/2
        sections:
          pages:
            type: pages
            templatesIgnore: documentation
          documentation:
            type: pages
            template: documentation
          navigation:
            type: fields
            fields:
              nav_headline:
                label: Navigation
                type: headline
              navigation:
                label: Navigationspunkte
                type: structure
                help: "Liste für die Hauptnavigation: Text + Sprungmarke oder URL"
                fields:
                  text:
                    label: Link-Text
                    type: text
                    width: 1/2
                    required: true
                  type:
                    label: Link-Typ
                    type: select
                    width: 1/2
                    options:
                      anchor: Sprungmarke (auf dieser Seite)
                      url: Externe/Interne URL
                    default: anchor
                  anchor:
                    label: Sprungmarke
                    type: text
                    width: 1/2
                    placeholder: z.B. "#kontakt"
                    when:
                      type: anchor
                  url:
                    label: URL/Pfad
                    type: text
                    width: 1/2
                    placeholder: /, /pfad oder https://…
                    when:
                      type: url
                    help: Interner Pfad (z. B. / oder /kontakt) oder vollständige externe URL
                  target:
                    label: Ziel
                    type: select
                    width: 1/2
                    options:
                      _self: Im gleichen Tab
                      _blank: In neuem Tab
                    default: _self
                  id:
                    label: ID/Name
                    type: text
                    width: 1/2
                    help: Optional eindeutige Kennung für CSS/Tracking
          owner:
            type: fields
            fields:
              contact:
                label: Basisdaten
                type: headline
              tagline:
                label: Untertitel
                type: text
                required: true
              headof:
                label: Name
                type: text
                required: true
              headofemail:
                label: E-mail
                type: email
                required: true
              adress:
                label: Anschrift
                type: textarea
                required: true
      - width: 1/2
        sections:
          meta:
            type: fields
            fields:
              medatdaten:
                label: Metadaten der Website
                type: headline
              info:
                label: Info
                type: info
                text: Die folgenden Felder werden teils nicht direkt angezeigt, sondern werden von Suchmaschinen und Drittanbietern verwendet.
              pagetitle:
                label: Titel der Website
                help: Wird im Tab des Browsers gezeigt und in Ergebnissen von Suchmaschinen gezeigt und sollte möglichst kurz sein.
                type: text
                required: true
              desc:
                label: Kurzbeschreibung der Website
                help: Wird in Ergebnissen von Suchmaschinen gezeigt und sollte zwischen 80 und 145 Zeichen umfassen.
                type: textarea
                required: true
              line:
                type: line
              socalmedia:
                label: Social Media Daten und Accounts
                type: headline
              socialimage: fields/social-share
              youtube:
                label: YoutTube Kanal
                help: Link zum Youtube Kanal
                type: url
              facebook:
                label: Facebook
                help: Link zur Facebook Seite
                type: url
              instagram:
                label: Instagram
                help: Link zur Instagram Seite
                type: url
  seo: seo/site
