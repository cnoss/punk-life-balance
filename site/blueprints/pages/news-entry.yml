title: News & Termine Eintrag

columns:
  - width: 1/2
    sections:
      info:
        type: fields
        fields:
          date:
            label: Angezeigtes Datum
            type: date
            calendar: true
            required: true
          text:
            label: Mengentext
            type: textarea
            required: false
          kind:
            label: News oder Termin
            type: radio
            default: news
            options:
              news: News
              termin: Termin
            columns: 2

          line:
            type: line
          furtherFields:
            label: Optionale Inhalte
            type: headline
          subtitle:
            label: Zweite Überschrift
            type: text
          linktext:
            label: Linktext zu anderer Seite, falls erforderlich
            type: text
          link:
            label: Link zu anderer Seite, falls erforderlich
            type: url
          youtube:
            label: ID des YouTube Videos
            type: text

          cover: fields/cover

          line2:
            type: line
          fieldsForDates:
            label: Für Termine
            type: headline
          dateOfGig:
            label: Datum des Termins
            type: date
            calendar: true
          venue:
            label: Ort des Termins
            type: text
          bitCity:
            label: Stadt
            type: text
            width: 1/2
          bitPostalCode:
            label: PLZ
            type: text
            width: 1/2
          bitAddress:
            label: Adresse (Straße + Nr.)
            type: text
            width: 1/2
          bitRegion:
            label: Region/Bundesland
            type: text
            width: 1/2
          bitCountry:
            label: Land
            type: text
            width: 1/2
            placeholder: Germany
          bitTimezone:
            label: Zeitzone
            type: text
            width: 1/2
            placeholder: Europe/Berlin
          price:
            label: Eintritt
            type: text
          begin:
            label: Beginn
            type: time

          bitTicketLink:
            label: Ticket-Link
            type: url
          bitTicketType:
            label: Ticket-Typ
            type: text
            placeholder: Tickets

          line3:
            type: line
          headlineFieldsForMultipeDates:
            label: Für Serientermine
            type: headline
          fieldsForMultipeDates:
            label: Termindaten
            type: structure
            fields:
              dateOfGig:
                label: Datum des Termins
                type: date
                calendar: true
                placeholder: "{{page.dateOfGig}}"

              venue:
                label: Ort des Termins
                type: text
                placeholder: "{{ page.venue }}"

              price:
                label: Eintritt
                type: text
                placeholder: "{{ page.price }}"


              begin:
                label: Beginn
                type: time
                placeholder: "{{page.begin}}"

              bitCity:
                label: Stadt
                type: text
                placeholder: "{{ page.bitCity }}"

              bitPostalCode:
                label: PLZ
                type: text
                placeholder: "{{ page.bitPostalCode }}"

              bitAddress:
                label: Adresse
                type: text
                placeholder: "{{ page.bitAddress }}"

              bitRegion:
                label: Region
                type: text
                placeholder: "{{ page.bitRegion }}"

              bitCountry:
                label: Land
                type: text
                placeholder: "{{ page.bitCountry }}"

              bitTimezone:
                label: Zeitzone
                type: text
                placeholder: "{{ page.bitTimezone }}"

              bitTicketLink:
                label: Ticket-Link
                type: url
                placeholder: "{{ page.bitTicketLink }}"

              bitTicketType:
                label: Ticket-Typ
                type: text
                placeholder: "{{ page.bitTicketType }}"

  - width: 1/2
    sections:
      gallery:
        type: files
        query: page.images
        template: image
